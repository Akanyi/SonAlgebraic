name: installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build:
    # 安装包是 Inno Setup + PyInstaller 产物，只能在 Windows 上出
    runs-on: windows-latest
    permissions:
      contents: write        # 打 tag 时要往 Release 传附件
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          pip install -e .[dev]
          pip install pyinstaller

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 读出版本号
        id: meta
        shell: bash
        run: |
          version=$(python -c "import sonalgebraic; print(sonalgebraic.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SADK $version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME 与 SADK 版本 v$version 不一致" >&2
            exit 1
          fi

      # zig 的 URL 和摘要写在 sadk.iss 里（单一来源），缓存键跟着它走：
      # 升级 zig 改了那几行，键自然失效重新下载，不会拿旧归档蒙混过关。
      - name: 缓存 Zig 归档
        uses: actions/cache@v6
        with:
          path: build/zig-cache
          key: zig-${{ hashFiles('installer/sadk.iss') }}

      - name: 构建在线版
        run: python installer/build_installer.py

      # 复用上一步的冻结产物，省掉重跑一遍 PyInstaller
      - name: 构建离线版（内置 Zig）
        run: python installer/build_installer.py --skip-freeze --bundle-zig

      - name: 列出产物
        shell: bash
        run: ls -lh build/installer/*.exe

      - name: 验证离线安装包
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python installer/smoke.py --bundled --setup build/installer/SADK-Setup-${{ steps.meta.outputs.version }}-with-zig.exe

      - uses: actions/upload-artifact@v7
        with:
          name: SADK-Setup-${{ steps.meta.outputs.version }}
          path: build/installer/*.exe
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/installer/*.exe
          body: |
            SonAlgebraic SDK ${{ steps.meta.outputs.version }} Windows 安装包。无需安装 Python。

            **本版更新**
            - 修复 Windows 安装目录和自带工具链路径的大小写、短路径及目录别名差异导致的 smoke 误报，恢复安装包发布验证。
            - 修复 `handler` / `sigaction` 生成名与 POSIX 系统宏冲突导致的 Linux C 编译失败。
            - 补齐函数引用/callable、复制/借用/移动、异步错误传播和 GUI 托管回调四个示例。
            - 44 个示例按主题整理；安装包附带 [示例导航](https://github.com/Akanyi/SonAlgebraic/blob/v${{ steps.meta.outputs.version }}/examples/README.md) 和完整清单，交互示例明确标记为手动运行。
            - 延续 0.2 系列能力：C/native 双后端无栈协程、Promise、AWAIT/SYNC、异步网络，以及函数引用、CALLRET、ENTITY 托管字段和 GUI 回调。
            - 编译器、Python 包和内置 VSCode 语法扩展版本统一为 ${{ steps.meta.outputs.version }}。

            安装后运行 `sonc doctor` 检查 C 工具链，入门示例为 `sonc run examples\basics\hello.sa`。

            | 安装包 | 说明 |
            |---|---|
            | `SADK-Setup-${{ steps.meta.outputs.version }}.exe` | 在线版。约 17 MB，需要 C 工具链时在安装向导里下载 Zig（约 93 MB）。 |
            | `SADK-Setup-${{ steps.meta.outputs.version }}-with-zig.exe` | 离线版。约 72 MB，x64 的 Zig 已在包内，装完直接能 `sonc build`。ARM64 机器仍会回退到在线下载。 |
